name: CI flujos críticos

# Tercera puerta del ticket CI-001. Cubre las suites que necesitan la API
# levantada contra PostgreSQL: pagos, conciliación, KYC, safety, soporte,
# recursos por audiencia y notificaciones.
#
# Las suites corren en un bucle que registra cada resultado en lugar de cortar
# en el primer fallo. Una corrida devuelve el estado completo, que es lo que
# hace falta para priorizar: un fallo temprano no debe ocultar los demás.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIGRATION_DATABASE_URL: postgresql://flash_app:ci_migration@127.0.0.1:5432/flash
  DATABASE_URL: postgresql://flash_runtime:ci_runtime@127.0.0.1:5432/flash
  DATABASE_SSL: "false"
  API_URL: http://127.0.0.1:4000/api
  # Coinciden con los valores por defecto de server/config.js fuera de
  # producción. El contenedor es efímero y no acepta conexiones externas.
  JWT_SECRET: flash-ci-secret-not-used-anywhere-else
  PAYMENT_WEBHOOK_SECRET: local-payment-webhook-secret-change-me
  METRICS_TOKEN: local-metrics-token-change-before-prod
  # Treinta suites contra una sola instancia agotan `AUTH_RATE_LIMIT_MAX`, que
  # por defecto son 40 intentos por minuto. El rate limiting no se deja de
  # verificar: `test:redis-rate-limit` lo prueba en ci-fast con su propio
  # límite bajo y dos réplicas. Acá sólo estorbaría.
  RATE_LIMIT_MAX: "100000"
  AUTH_RATE_LIMIT_MAX: "100000"

jobs:
  critical-flows:
    name: Flujos críticos con API levantada
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: flash
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create separated database roles
        env:
          PGPASSWORD: ci_admin
        run: |
          psql --set=ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d flash <<'SQL'
          CREATE ROLE flash_app       LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci_migration';
          CREATE ROLE flash_runtime   LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci_runtime';
          CREATE ROLE flash_rls_audit LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci_audit';
          ALTER DATABASE flash OWNER TO flash_app;
          SQL

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:check
          npm run db:seed:auth
          npm run db:seed:addresses
          npm run db:seed:commerce
          npm run db:seed:orders
          npm run db:seed:mobility
          npm run db:seed:wallet
          npm run db:seed:derived

      - name: Build web assets
        run: npm run build

      - name: Start API
        run: |
          node server/start.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$API_URL/ready" > /dev/null 2>&1; then
              echo "API lista tras ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::La API no alcanzó readiness en 60s"
          cat /tmp/api.log
          exit 1

      - name: Critical flow suites
        run: |
          suites="
          test:postgres
          test:audience-bootstrap
          test:activity-pagination
          test:catalog-pagination
          test:operations-resources
          test:mfa
          test:password-recovery
          test:email-verification
          test:phone-verification
          test:payment-methods
          test:payment-reconciliation
          test:transaction-risk
          test:payout-review
          test:tip-adjustments
          test:referrals
          test:driver-kyc
          test:driver-vehicles
          test:driver-earnings
          test:driver-operational-time
          test:driver-demand
          test:driver-preferences
          test:ride-safety
          test:service-chat
          test:shipment-claims
          test:support-sla
          test:support-routing
          test:notification-preferences
          test:notification-dead-letters
          test:dietary-local
          test:notification-local
          test:remote-sessions
          test:maps
          "
          passed=0
          failed=""
          for suite in $suites; do
            # Marcador propio: Actions consume las anotaciones ::group:: y el log
            # descargado pierde la correspondencia entre suite y error.
            echo "---- SUITE $suite ----"
            if npm run "$suite" --silent; then
              passed=$((passed + 1))
              echo "---- OK $suite ----"
            else
              failed="$failed $suite"
              echo "---- FALLA $suite ----"
            fi
          done
          echo ""
          echo "== Resumen =="
          echo "verdes: $passed"
          if [ -n "$failed" ]; then
            echo "rojas:$failed"
            exit 1
          fi
          echo "todas las suites de flujos críticos pasaron"

      - name: API log
        if: failure()
        run: tail -200 /tmp/api.log

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          fi

name: CI rápida

# Puerta rápida: todo lo que puede verificarse sin PostgreSQL.
# Las suites que necesitan base de datos viven en ci-postgres.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Relanzable a mano desde la pestaña Actions.
  #
  # Sin esto, un fallo de agendamiento de GitHub —que ocurre: el 26 de agosto
  # una corrida murió en `startup_failure` con cero jobs y blobs de workflow
  # byte-idénticos a los de la corrida verde anterior— sólo se puede limpiar
  # empujando otro commit. En un repositorio donde CI es la puerta de merge,
  # eso convierte un problema transitorio de la plataforma en un commit basura.
  workflow_dispatch:

jobs:
  build-and-security:
    name: Build y contratos estáticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # Las nueve reglas de autorización quedaron puras al extraerse a
      # `server/http/authorization.js` (ARC-001). Antes sólo podían ejercitarse
      # levantando la API entera, lo que cubre los caminos que alguien recordó
      # probar y no la regla en sí. Este contrato afirma cada una directamente.
      - name: Authorization contract
        run: npm run test:authorization
      - name: Domain purity
        run: npm run test:domain-purity
      - name: Module references
        run: npm run test:module-references

      # La extraccion de rutas hace facil copiar en lugar de mover. Esta puerta
      # busca lo contrario que la de arriba: una definicion sin uso, no un uso
      # sin definicion. Encontro dos al escribirse.
      - name: Dead internal declarations
        run: npm run test:dead-code

      # El proceso no atiende en produccion si el rol de PostgreSQL puede saltear
      # RLS. Es decision pura sobre el readiness, asi que corre sin base.
      - name: RLS bypass refusal
        run: npm run test:rls-guard

      # El runtime no recupera DML sobre todas las tablas ni la herencia
      # automatica que hizo alcanzable un almacen de credenciales muerto.
      - name: Runtime grant scope
        run: npm run test:grant-scope

      # Una puerta que nadie sabe que existe no se mantiene. Esta exige que cada
      # script test: este nombrado en docs/, con trinquete sobre la deuda previa.
      - name: Gates are documented
        run: npm run test:docs-coverage

      # `sanitizeUser` decide qué campos de un usuario salen por HTTP. Al
      # volverse módulo propio quedó sin puerta; esta encontró una copia de la
      # redacción escrita a mano en auth-repository.js.
      - name: User redaction contract
        run: npm run test:user-view

      # `pesos` estaba definida tres veces. La puerta impide la cuarta y fija
      # en 26 las conversiones en linea que la unificacion dejo a la vista.
      - name: Money conversion contract
        run: npm run test:money

      # Un 500 no describe su causa. Lo decidia el manejador global, pero 130
      # handlers lo puenteaban capturando el error ellos mismos. Se encontro
      # probando en el navegador, no leyendo codigo.
      - name: Error disclosure contract
        run: npm run test:error-disclosure

      - name: Realtime audience contract
        run: npm run test:realtime-audience

      # Sin esta puerta el código vuelve a derivar al estado que hacía ilegible
      # cualquier diff. El ratchet acota el daño heredado; el formateador impide
      # que se genere daño nuevo.
      - name: Formatting
        run: npm run test:format

      - name: Line length ratchet
        run: npm run test:line-length

      # Impide que una suite nueva quede fuera de toda puerta sin que se note,
      # que fue exactamente lo que ocurrió con 89 de 104 scripts.
      - name: CI coverage gate
        run: npm run test:ci-coverage

      # Toda tabla nueva tiene que declarar su clase. El hallazgo H-04 fue que
      # 20 de 106 no tenían política y nada lo hacía evidente.
      - name: RLS coverage matrix
        run: npm run test:rls-matrix

      # Contratos de pagos que no necesitan proveedor ni base: prueban el
      # cliente de Mercado Pago con fetch interceptado y las funciones puras
      # de liquidación. Son baratos y cubren el núcleo financiero.
      # Contratos de proveedores externos con `fetch` interceptado: verifican el
      # contrato sin credenciales ni red. Lo que no pueden verificar es la
      # entrega real, que sigue siendo condición de cierre de cada ticket.
      - name: Push provider contract
        run: npm run test:push-provider

      - name: Maps provider contract
        run: npm run test:maps-provider

      - name: Dispatch candidate selection contract
        run: npm run test:dispatch-candidates

      - name: Payment provider contracts
        run: |
          npm run test:mercadopago-payment
          npm run test:mercadopago-webhook
          npm run test:payment-oauth
          npm run test:marketplace-ledger

      - name: Web and session contracts
        run: |
          npm run test:web-auth-session
          npm run test:network-resilience
          npm run test:web-checkout
          npm run test:web-ride-home
          npm run test:web-tracking-maps
          npm run test:merchant-operations-ui
          npm run test:product-analytics-local

      - name: Mobile surface contracts
        run: |
          npm run test:mobile-maps
          npm run test:mobile-auth-design
          npm run test:mobile-food-design

      - name: Responsive layout contract
        run: npm run test:responsive-layout

      - name: Web bundle budget
        run: npm run test:web-bundle-budget

      - name: Web compression and cache contract
        run: npm run test:web-delivery

      - name: OpenAPI core contract
        run: npm run test:openapi-contract

      - name: Graceful shutdown contract
        run: npm run test:graceful-shutdown

      - name: Secret scan
        run: npm run test:secrets

      - name: Production dependency gate
        run: npm run test:dependency-gate

      # Todo lo que quede en `dependencies` se despliega: la imagen instala con
      # --omit=dev. Siete paquetes que solo usa el frente viajaban en cada imagen.
      - name: Production dependencies are used by the server
        run: npm run test:production-deps

      - name: OpenTelemetry export contract
        run: npm run test:telemetry

      - name: Prometheus alert contracts
        run: npm run test:observability-rules

      - name: Provider resilience contracts
        run: npm run test:provider-resilience

      - name: Container least-privilege contract
        run: npm run test:container-security

      - name: Distributed Redis rate limit
        run: npm run test:redis-rate-limit

  local-fallback:
    name: Contrato del fallback local
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `test:dietary-local` y `test:notification-local` prueban el fallback
    # SQLite, cuyo contrato NO es el de PostgreSQL: devuelve etiquetas dietarias
    # como strings donde el runtime PostgreSQL devuelve objetos con `.code`.
    #
    # Correrlas contra la API de PostgreSQL es sencillamente la prueba
    # equivocada. Acá no hay `DATABASE_URL`, así que la API arranca sobre el
    # fallback y es el contrato que estas suites afirman.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Start API on the SQLite fallback
        env:
          NODE_ENV: test
        run: |
          node server/start.js > /tmp/local-api.log 2>&1 &
          echo $! > /tmp/local-api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/ready > /dev/null 2>&1; then
              echo "API local lista tras ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::La API del fallback no alcanzó readiness"
          cat /tmp/local-api.log
          exit 1

      - name: Seed local fixtures
        run: npm run db:seed:auth || echo "seed no aplicable al fallback"
        continue-on-error: true

      - name: Local fallback contracts
        run: |
          npm run test:dietary-local
          npm run test:notification-local

      # Ninguna ruta puede responder 500 sobre este runtime. Levanta su propia
      # instancia en otro puerto, asi que no depende de la API de arriba.
      - name: No route answers 500 on the fallback
        run: npm run test:fallback-degradation

      - name: API log
        if: failure()
        run: tail -200 /tmp/local-api.log

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/local-api.pid ]; then
            kill "$(cat /tmp/local-api.pid)" 2>/dev/null || true
          fi

  container-image:
    name: Imagen productiva endurecida
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `test:container-security` valida el Dockerfile como texto. Este job
    # construye la imagen de verdad y comprueba el resultado: un contrato
    # estático puede pasar mientras la imagen real hace otra cosa.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t flash:ci .

      - name: El proceso no corre como root
        run: |
          id_output=$(docker run --rm flash:ci id)
          echo "$id_output"
          case "$id_output" in
            *"uid=0(root)"*)
              echo "::error::La imagen corre como root"
              exit 1
              ;;
          esac
          echo "$id_output" | grep -q "flash" || {
            echo "::error::La imagen no corre como el usuario flash"
            exit 1
          }

      - name: La imagen no incluye devDependencies
        run: |
          for package in typescript vite playwright terser; do
            if docker run --rm flash:ci test -d "node_modules/$package"; then
              echo "::error::La imagen productiva incluye la devDependency $package"
              exit 1
            fi
          done
          echo "sin devDependencies en la imagen productiva"

      - name: La imagen no incluye el árbol de fuentes del frontend
        run: |
          for path in src apps .git; do
            if docker run --rm flash:ci test -e "$path"; then
              echo "::error::La imagen productiva incluye $path"
              exit 1
            fi
          done
          echo "la imagen sólo contiene los artefactos necesarios"

      - name: El entrypoint es el instrumentado
        run: |
          entrypoint=$(docker image inspect flash:ci --format '{{ join .Config.Cmd " " }}')
          echo "CMD: $entrypoint"
          case "$entrypoint" in
            *"server/start.js"*) echo "arranca el entrypoint instrumentado" ;;
            *) echo "::error::La imagen no arranca server/start.js"; exit 1 ;;
          esac

      - name: Capabilities eliminadas y sin escalada de privilegios
        run: |
          # Reproduce el endurecimiento declarado en docker-compose.yml.
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges:true \
            flash:ci node -e "console.log('el runtime arranca sin capabilities')"

      # El criterio de INF-001 pedia una corrida real, no un contrato de texto:
      # un filesystem de solo lectura falla en el primer write, y la unica forma
      # de saber si hay alguno es arrancar el proceso hasta que responda.
      #
      # Los dos montajes escribibles son los mismos que declara docker-compose.
      # `/app/server/data` hace falta porque `server/store.js` abre la base
      # SQLite del respaldo al importarse, sin mirar si hay PostgreSQL.
      #
      # Corre con `NODE_ENV=test` y sin `DATABASE_URL` a proposito, y no es una
      # concesion: asi arranca sobre el respaldo SQLite, que **escribe mas** que
      # el runtime de PostgreSQL —abre la base, el WAL y el shm en disco, donde
      # el otro lee y escribe por red—. Es el caso mas exigente para una raiz de
      # solo lectura.
      #
      # En produccion no arrancaria sin `DATABASE_URL`: `config.js` lo exige, y
      # el primer intento de este paso lo demostro fallando con
      # «DATABASE_URL must point to PostgreSQL/PostGIS in production».
      - name: El proceso arranca con la raiz de solo lectura
        run: |
          docker run -d --name flash-readonly \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/server/data:uid=999,gid=999 \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            -e NODE_ENV=test \
            -e JWT_SECRET=ci-readonly-secret-not-used-anywhere-else \
            -p 4010:4000 flash:ci
          listo=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4010/api/health > /dev/null 2>&1; then
              echo "la imagen responde con la raiz de solo lectura tras ${attempt}s"
              listo=1
              break
            fi
            sleep 1
          done
          if [ "$listo" -ne 1 ]; then
            echo "::error::La imagen no arranco con --read-only"
            docker logs flash-readonly
            docker rm -f flash-readonly
            exit 1
          fi
          # Un write fuera de los montajes declarados tiene que fallar. Si esto
          # pasara, la raiz no era de solo lectura y el paso no probaba nada.
          if docker exec flash-readonly sh -c "touch /app/prueba-escritura" 2>/dev/null; then
            echo "::error::La raiz acepta escrituras: --read-only no esta activo"
            docker rm -f flash-readonly
            exit 1
          fi
          echo "la raiz rechaza escrituras fuera de los montajes declarados"
          docker rm -f flash-readonly

      - name: Tamaño de la imagen
        run: |
          size=$(docker image inspect flash:ci --format '{{ .Size }}')
          echo "imagen productiva: $((size / 1024 / 1024)) MiB"

      # SBOM y scan de la imagen (ticket INF-001).
      #
      # Se usa Trivy por imagen fijada y no por una accion del marketplace: una
      # accion es codigo de terceros que corre con el token del workflow, y para
      # esto no hace falta. Una etiqueta fija es revisable y se actualiza a
      # proposito.
      #
      # El SBOM se publica como artefacto en formato CycloneDX. Sirve para
      # responder despues «¿esta imagen tenia el paquete X?» sin reconstruirla,
      # que es la pregunta que aparece el dia que se publica una vulnerabilidad.
      - name: SBOM de la imagen productiva
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/salida" \
            aquasec/trivy:0.58.1 image \
            --format cyclonedx \
            --output /salida/sbom-flash.cdx.json \
            flash:ci
          paquetes=$(node -e "const s=require('./sbom-flash.cdx.json');console.log((s.components||[]).length)")
          echo "SBOM generado: $paquetes componentes"

      - name: SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-flash-cyclonedx
          path: sbom-flash.cdx.json
          if-no-files-found: error

      # La politica de fallo bloquea **lo que este equipo puede arreglar**, que
      # resulto no ser lo mismo que lo que tiene parche publicado.
      #
      # La primera version usaba solo `--ignore-unfixed` y fallo en su primera
      # corrida con cuatro CVEs altas en `brace-expansion`, `ip-address` y `tar`.
      # Ninguna es del proyecto: son dependencias del npm que viene dentro de
      # `node:24-bookworm-slim`, en `/usr/local/lib/node_modules`. Tienen version
      # corregida upstream, asi que `--ignore-unfixed` las conservaba, pero aca no
      # se pueden actualizar sin cambiar de imagen base. La capa Debian dio 0.
      #
      # Bloquear por esas cerraria el merge por algo que no se puede resolver, y
      # el desenlace conocido de eso es que alguien apague la puerta: el hallazgo
      # H-01 otra vez, por otro camino. Por eso el scan que corta se salta el
      # `node_modules` de npm y mira lo que agregamos nosotros, que es donde una
      # CVE con arreglo si es una orden de actualizar.
      #
      # Lo heredado no se ignora, se informa: el paso siguiente lista todo, sin
      # cortar, para que cambiar de base siga siendo una decision con datos.
      - name: Vulnerabilidades que podemos arreglar
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs /usr/local/lib/node_modules \
            --exit-code 1 \
            --no-progress \
            flash:ci

      - name: Inventario completo, incluida la imagen base
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --no-progress \
            flash:ci || true

  mobile-typecheck:
    name: Mobile typecheck y variantes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: apps/mobile

      - name: Validate native runtime and build variants
        run: npm run test:mobile-native-runtime && npm run test:mobile-build-variants

      # Los dos criterios de build de ARC-001 no se pueden leer del codigo:
      # dependen de que modulos alcanza Metro. Esto empaqueta las tres variantes
      # de verdad y comprueba que cada bundle Hermes lleve una sola pantalla.
      - name: Variant bundles contain a single screen
        run: npm run test:mobile-variant-bundles
        working-directory: ${{ github.workspace }}

name: CI rápida

# Puerta rápida: todo lo que puede verificarse sin PostgreSQL.
# Las suites que necesitan base de datos viven en ci-postgres.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-security:
    name: Build y contratos estáticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Realtime audience contract
        run: npm run test:realtime-audience

      - name: Line length ratchet
        run: npm run test:line-length

      # Impide que una suite nueva quede fuera de toda puerta sin que se note,
      # que fue exactamente lo que ocurrió con 89 de 104 scripts.
      - name: CI coverage gate
        run: npm run test:ci-coverage

      # Toda tabla nueva tiene que declarar su clase. El hallazgo H-04 fue que
      # 20 de 106 no tenían política y nada lo hacía evidente.
      - name: RLS coverage matrix
        run: npm run test:rls-matrix

      # Contratos de pagos que no necesitan proveedor ni base: prueban el
      # cliente de Mercado Pago con fetch interceptado y las funciones puras
      # de liquidación. Son baratos y cubren el núcleo financiero.
      # Contratos de proveedores externos con `fetch` interceptado: verifican el
      # contrato sin credenciales ni red. Lo que no pueden verificar es la
      # entrega real, que sigue siendo condición de cierre de cada ticket.
      - name: Push provider contract
        run: npm run test:push-provider

      - name: Maps provider contract
        run: npm run test:maps-provider

      - name: Payment provider contracts
        run: |
          npm run test:mercadopago-payment
          npm run test:mercadopago-webhook
          npm run test:payment-oauth
          npm run test:marketplace-ledger

      - name: Web and session contracts
        run: |
          npm run test:web-auth-session
          npm run test:network-resilience
          npm run test:web-checkout
          npm run test:web-ride-home
          npm run test:web-tracking-maps
          npm run test:merchant-operations-ui
          npm run test:product-analytics-local

      - name: Mobile surface contracts
        run: |
          npm run test:mobile-maps
          npm run test:mobile-auth-design
          npm run test:mobile-food-design

      - name: Responsive layout contract
        run: npm run test:responsive-layout

      - name: Web bundle budget
        run: npm run test:web-bundle-budget

      - name: Web compression and cache contract
        run: npm run test:web-delivery

      - name: OpenAPI core contract
        run: npm run test:openapi-contract

      - name: Graceful shutdown contract
        run: npm run test:graceful-shutdown

      - name: Secret scan
        run: npm run test:secrets

      - name: Production dependency gate
        run: npm run test:dependency-gate

      - name: OpenTelemetry export contract
        run: npm run test:telemetry

      - name: Prometheus alert contracts
        run: npm run test:observability-rules

      - name: Provider resilience contracts
        run: npm run test:provider-resilience

      - name: Container least-privilege contract
        run: npm run test:container-security

      - name: Distributed Redis rate limit
        run: npm run test:redis-rate-limit

  container-image:
    name: Imagen productiva endurecida
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `test:container-security` valida el Dockerfile como texto. Este job
    # construye la imagen de verdad y comprueba el resultado: un contrato
    # estático puede pasar mientras la imagen real hace otra cosa.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t flash:ci .

      - name: El proceso no corre como root
        run: |
          id_output=$(docker run --rm flash:ci id)
          echo "$id_output"
          case "$id_output" in
            *"uid=0(root)"*)
              echo "::error::La imagen corre como root"
              exit 1
              ;;
          esac
          echo "$id_output" | grep -q "flash" || {
            echo "::error::La imagen no corre como el usuario flash"
            exit 1
          }

      - name: La imagen no incluye devDependencies
        run: |
          for package in typescript vite playwright terser; do
            if docker run --rm flash:ci test -d "node_modules/$package"; then
              echo "::error::La imagen productiva incluye la devDependency $package"
              exit 1
            fi
          done
          echo "sin devDependencies en la imagen productiva"

      - name: La imagen no incluye el árbol de fuentes del frontend
        run: |
          for path in src apps .git; do
            if docker run --rm flash:ci test -e "$path"; then
              echo "::error::La imagen productiva incluye $path"
              exit 1
            fi
          done
          echo "la imagen sólo contiene los artefactos necesarios"

      - name: El entrypoint es el instrumentado
        run: |
          entrypoint=$(docker image inspect flash:ci --format '{{ join .Config.Cmd " " }}')
          echo "CMD: $entrypoint"
          case "$entrypoint" in
            *"server/start.js"*) echo "arranca el entrypoint instrumentado" ;;
            *) echo "::error::La imagen no arranca server/start.js"; exit 1 ;;
          esac

      - name: Capabilities eliminadas y sin escalada de privilegios
        run: |
          # Reproduce el endurecimiento declarado en docker-compose.yml.
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges:true \
            flash:ci node -e "console.log('el runtime arranca sin capabilities')"

      - name: Tamaño de la imagen
        run: |
          size=$(docker image inspect flash:ci --format '{{ .Size }}')
          echo "imagen productiva: $((size / 1024 / 1024)) MiB"

  mobile-typecheck:
    name: Mobile typecheck y variantes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: apps/mobile

      - name: Validate native runtime and build variants
        run: npm run test:mobile-native-runtime && npm run test:mobile-build-variants

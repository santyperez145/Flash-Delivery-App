groups:
  - name: flash-api-slo
    interval: 30s
    rules:
      - alert: FlashApiFastErrorBudgetBurn
        expr: |
          (sum(rate(flash_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(flash_http_requests_total[5m])), 0.001)) > 0.0144
          and
          (sum(rate(flash_http_requests_total{status=~"5.."}[1h])) / clamp_min(sum(rate(flash_http_requests_total[1h])), 0.001)) > 0.0144
        for: 5m
        labels: { severity: page, slo: api-availability-99.9 }
        annotations: { summary: "Flash API consume rápidamente su presupuesto de error", runbook: "docs/runbooks/api-error-budget.md" }
      - alert: FlashApiSlowErrorBudgetBurn
        expr: |
          (sum(rate(flash_http_requests_total{status=~"5.."}[6h])) / clamp_min(sum(rate(flash_http_requests_total[6h])), 0.001)) > 0.006
          and
          (sum(rate(flash_http_requests_total{status=~"5.."}[3d])) / clamp_min(sum(rate(flash_http_requests_total[3d])), 0.001)) > 0.006
        for: 30m
        labels: { severity: ticket, slo: api-availability-99.9 }
        annotations: { summary: "Flash API consume sostenidamente su presupuesto de error", runbook: "docs/runbooks/api-error-budget.md" }
      - alert: FlashApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(flash_http_request_duration_seconds_bucket[10m]))) > 1.5
        for: 15m
        labels: { severity: ticket, slo: api-latency }
        annotations: { summary: "Latencia p95 de Flash API por encima de 1,5 segundos", runbook: "docs/runbooks/api-latency.md" }
  - name: flash-runtime-health
    interval: 30s
    rules:
      - alert: FlashPostgresPoolSaturated
        expr: flash_postgres_pool_connections{state="waiting"} > 5
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Solicitudes esperando conexiones PostgreSQL", runbook: "docs/runbooks/postgres-pool.md" }
      - alert: FlashNotificationDeadLetters
        expr: flash_notifications{status="dead_letter"} > 0
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Existen notificaciones en dead-letter", runbook: "docs/runbooks/notification-dead-letter.md" }
      - alert: FlashMapProviderDegraded
        expr: sum(rate(flash_provider_calls_total{provider=~"openstreetmap|osrm",outcome!="success"}[10m])) > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Proveedor de mapas degradado o con circuito abierto", runbook: "docs/runbooks/map-provider.md" }
      - alert: FlashPaymentProviderDegraded
        expr: |
          (sum(rate(flash_provider_calls_total{provider="mercadopago",outcome!="success"}[10m]))
          / clamp_min(sum(rate(flash_provider_calls_total{provider="mercadopago"}[10m])), 0.001)) > 0.05
          and sum(increase(flash_provider_calls_total{provider="mercadopago"}[10m])) >= 10
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Mercado Pago supera 5% de fallos con volumen significativo", runbook: "docs/runbooks/payment-provider.md" }
      - alert: FlashMerchantPaymentOAuthReconnectRequired
        expr: flash_merchant_payment_oauth_connections{status="reconnect_required"} > 0
        for: 15m
        labels: { severity: page }
        annotations: { summary: "Hay comercios cuya autorización de cobro debe reconectarse", runbook: "docs/runbooks/merchant-payment-oauth.md" }
      - alert: FlashExpiredIdempotencyBacklog
        expr: flash_idempotency_keys{status="expired"} > 10000
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "El backlog de claves idempotentes vencidas no está drenando", runbook: "docs/runbooks/idempotency-backlog.md" }
      - alert: FlashRealtimeUnclassifiedAudience
        expr: sum(increase(flash_realtime_audience_total{outcome="unclassified"}[15m])) > 0
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Eventos realtime sin audiencia resoluble quedaron restringidos a operaciones", runbook: "docs/runbooks/realtime-audience.md" }

services:
  redis:
    image: redis:8.2-alpine
    container_name: flash-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - flash-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgis/postgis:17-3.5
    container_name: flash-postgres
    environment:
      POSTGRES_DB: flash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-flash_local_admin_password}
      FLASH_MIGRATION_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:-flash_local_migration_password}
      FLASH_RUNTIME_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:-flash_local_runtime_password}
      FLASH_AUDIT_PASSWORD: ${AUDIT_DATABASE_PASSWORD:-flash_local_audit_password}
    ports:
      - "5432:5432"
    volumes:
      - flash-postgres-data:/var/lib/postgresql/data
      - ./database/docker-init/001-runtime-roles.sh:/docker-entrypoint-initdb.d/20_flash_runtime_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash"]
      interval: 5s
      timeout: 5s
      retries: 12

  flash:
    build: .
    container_name: flash-delivery-mobility
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-change-this-docker-secret-before-real-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4000,http://localhost:4000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-40}
      DATABASE_URL: postgresql://flash_runtime:${RUNTIME_DATABASE_PASSWORD:-flash_local_runtime_password}@postgres:5432/flash
      MIGRATION_DATABASE_URL: postgresql://flash_app:${MIGRATION_DATABASE_PASSWORD:-flash_local_migration_password}@postgres:5432/flash
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
    ports:
      - "4000:4000"
    volumes:
      - flash-data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && node server/start.js"]
    restart: unless-stopped

volumes:
  flash-data:
  flash-postgres-data:
  flash-redis-data:
